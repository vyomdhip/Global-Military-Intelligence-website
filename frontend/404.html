<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The requested page could not be found on Global Military Intelligence.">
    <title>404 Page Not Found | Global Military Intelligence</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css?v=2.6.8">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-primary, #0a1628);
            color: var(--color-text-primary, #ffffff);
            font-family: var(--font-body, 'Inter', sans-serif);
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }

        .standalone-404-main {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl, 2rem) var(--space-md, 1rem);
            position: relative;
            z-index: 1;
        }

        .standalone-404-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% 40%, rgba(212, 175, 55, 0.08) 0%, transparent 65%),
                linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
            background-size: 100% 100%, 48px 48px, 48px 48px;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>

<body>
    <div class="standalone-404-bg" aria-hidden="true"></div>

    <!-- Main Content -->
    <main class="standalone-404-main" role="main">
        <div class="not-found-container">
            <div class="not-found-card">
                <div class="not-found-badge">
                    <span class="not-found-badge-dot"></span>
                    <span>ERROR 404 &bull; ROUTE NOT FOUND</span>
                </div>

                <div class="not-found-code-wrap">
                    <h1 class="not-found-code">404</h1>
                </div>

                <h2 class="not-found-title">Page Not Found</h2>

                <p class="not-found-message">The requested page could not be found.</p>

                <span class="not-found-subtext">The tactical sector or file path you requested does not exist or may
                    have been relocated.</span>

                <div class="not-found-actions">
                    <a href="/home" class="btn btn-primary not-found-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        <span>Return Home</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
